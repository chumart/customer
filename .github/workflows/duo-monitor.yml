name: iPhone Duo 库存监控

on:
  # 每天盯太平洋时间 5:00-6:00 的补货。GitHub 定时任务实测会晚 3 小时以上才启动，
  # 所以从太平洋时间午夜前后开始每小时触发一次（UTC 时间），任务启动后自己等到 5:00，
  # 每分钟的第 30 秒查一次（插在两台电脑中间），6:00 结束。同一时间只跑一个，
  # 排队的那次等前一个结束后发现时间窗已过会直接退出。
  # GitHub 单个任务最长 6 小时：最早一次 08:15 UTC = 太平洋 0:15(冬令时)/1:15(夏令时)，等到 6:00 不超时。
  schedule:
    - cron: "15 8 * * *"
    - cron: "15 9 * * *"
    - cron: "15 10 * * *"
    - cron: "15 11 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式"
        type: choice
        default: window
        options:
          - window     # 等到 5:00（太平洋时间），每分钟查一次到 6:00
          - check      # 检查库存，新到货就推送
          - once       # 打印所有门店×型号的当前状态
          - discover   # 列出购买页里的所有 part number
          - test-bark  # 发一条测试推送

concurrency:
  group: duo-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 记住上次各门店的库存状态，只在「无货 → 有货」时推送
      - uses: actions/cache@v4
        with:
          path: state.json
          key: duo-state-${{ github.run_id }}
          restore-keys: duo-state-

      - name: Run
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          MODE: ${{ inputs.mode || 'window' }}
        run: |
          case "$MODE" in
            window)    python3 duo_monitor.py -c config.cloud.json --window 05:00-06:00 --every 60 --offset 30 ;;
            check)     python3 duo_monitor.py -c config.cloud.json --state state.json ;;
            once)      python3 duo_monitor.py -c config.cloud.json --once ;;
            discover)  python3 duo_monitor.py -c config.cloud.json --discover ;;
            test-bark) python3 duo_monitor.py -c config.cloud.json --test-bark ;;
          esac
